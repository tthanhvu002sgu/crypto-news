<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    :root {
      --bg: #111111;
      --icon: #f7f6f3;
      --border: rgba(0, 0, 0, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #ffffff;
        --icon: #0a0a0c;
        --border: rgba(255, 255, 255, 0.15);
      }
    }
    .bg-rect {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 16;
    }
    .icon-polyline {
      stroke: var(--icon);
      stroke-width: 26;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
  <rect class="bg-rect" x="16" y="16" width="480" height="480" rx="80" ry="80" />
  <polyline class="icon-polyline" points="136 256 184 256 220 148 292 364 328 256 376 256" />
</svg>